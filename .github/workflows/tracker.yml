name: Global Macro & Conflict Tracker

on:
  schedule:
    # Runs at 12:00 PM and 12:00 AM UTC every day
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows you to trigger it manually via a button in the Actions tab

jobs:
  track-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the bot permission to push the CSV back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tracker Script
        run: python tracker.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add commodity_prices.csv
          # The "|| echo" prevents the workflow from failing if no new data was fetched
          git commit -m "data: append latest market and conflict metrics" || echo "No changes to commit"
          git push origin main