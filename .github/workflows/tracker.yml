name: Global Macro & Conflict Tracker

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  track-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tracker Script
        run: python tracker.py

      - name: Generate Heatmap
        run: python generate_heatmap.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add commodity_prices.csv heatmap.png
          git commit -m "data: update market metrics and correlation heatmap" || echo "No changes to commit"
          git push origin main