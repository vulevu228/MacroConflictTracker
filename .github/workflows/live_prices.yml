name: Live Gold & Brent Price Tracker

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: live-prices-tracker
  cancel-in-progress: false

jobs:
  track-live-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Live Price Tracker
        run: python live_prices.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live_prices.db
          git commit -m "data: log live Gold/Brent price snapshot" || echo "No changes to commit"
          for i in 1 2 3 4 5; do
            git pull --no-rebase -X ours origin main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 10 + 5))
          done
